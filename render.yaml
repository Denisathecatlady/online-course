services:
  # ─── PRODUCTION ─────────────────────────────────────────────────────────────
  - type: web
    name: calmdog
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SHOW_PREVIEW_BANNER
        value: "0"
      - key: DJANGO_DEBUG
        value: "0"
      - key: ENABLE_HTTPS
        value: "1"
      - key: USE_S3_STORAGE
        value: "0"
      - key: PACKETA_MODE
        value: live
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: calmdog-db
          property: connectionString
      - key: SITE_URL
        value: https://www.calmdog.cz
      - key: DJANGO_ALLOWED_HOSTS
        value: www.calmdog.cz,calmdog.cz
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://www.calmdog.cz,https://calmdog.cz
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: PACKETA_API_PASSWORD
        sync: false
      - key: PACKETA_WIDGET_API_KEY
        sync: false
      # Indikace odesílatele (sender) z Packeta administrace – musí přesně sedět
      - key: PACKETA_ESHOP_NAME
        sync: false
      - key: HEUREKA_API_KEY
        sync: false
      - key: HOTEL_ICAL_URL
        sync: false
      - key: MAPY_API_KEY
        sync: false
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false
      # Google Calendar OAuth (rezervace tréninků)
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://www.calmdog.cz/moje-treninky/google/callback/
      # Přihlášení přes Google (allauth) – vlastní OAuth klient, jiný než výše
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ─── CRON: žádosti o Google recenzi (jen produkce) ──────────────────────────
  - type: cron
    name: calmdog-review-requests
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "0 8 * * *"   # každý den v 8:00 UTC = 9:00/10:00 CZ
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_review_requests
    envVars:
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "0"
      - key: USE_S3_STORAGE
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: calmdog-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: www.calmdog.cz,calmdog.cz
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false

  # ─── CRON: synchronizace Google kalendáře (rezervace tréninků) ──────────────
  # 1) import_availability_from_google – načte volné termíny z kalendářů dostupnosti
  # 2) sync_google_calendar – zruší rezervace, jejichž událost byla v Googlu smazána
  - type: cron
    name: calmdog-training-gcal-sync
    runtime: python
    plan: starter
    region: frankfurt
    branch: main
    schedule: "*/30 * * * *"   # každých 30 minut
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py import_availability_from_google && python manage.py sync_google_calendar
    envVars:
      - key: APP_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "0"
      - key: USE_S3_STORAGE
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: calmdog-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: www.calmdog.cz,calmdog.cz
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  # ─── STAGING / PREVIEW ──────────────────────────────────────────────────────
  - type: web
    name: calmdog-preview
    runtime: python
    plan: starter
    region: frankfurt
    branch: staging
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: SHOW_PREVIEW_BANNER
        value: "1"
      - key: DJANGO_DEBUG
        value: "0"
      - key: ENABLE_HTTPS
        value: "1"
      - key: USE_S3_STORAGE
        value: "0"
      - key: PACKETA_MODE
        value: live
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: calmdog-preview-db
          property: connectionString
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: SITE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: PACKETA_WIDGET_API_KEY
        sync: false
      - key: PACKETA_API_PASSWORD
        sync: false
      # Indikace odesílatele (sender) z Packeta administrace – musí přesně sedět
      - key: PACKETA_ESHOP_NAME
        sync: false
      - key: HEUREKA_API_KEY
        sync: false
      - key: MAPY_API_KEY
        sync: false
      # Přihlášení přes Google (allauth)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: calmdog-db
    plan: starter
    region: frankfurt

  - name: calmdog-preview-db
    plan: starter
