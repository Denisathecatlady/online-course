services:
  - type: web
    name: calmdog-preview
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: SHOW_PREVIEW_BANNER
        value: "1"
      - key: DJANGO_DEBUG
        value: "0"
      - key: ENABLE_HTTPS
        value: "1"
      - key: USE_S3_STORAGE
        value: "0"
      - key: PACKETA_MODE
        value: mock
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: calmdog-preview-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: calmdog-preview-db
    plan: starter
