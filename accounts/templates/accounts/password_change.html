{% extends "accounts/account_base.html" %}

{% block account_content %}
<div class="account-content-card">
  <div class="account-content-head">
    <div>
      <p class="account-eyebrow mb-2">Bezpečnost</p>
      <h2 class="account-title mb-1">Změna hesla</h2>
      <p class="account-copy mb-0">
        Zadej současné heslo a nastav nové.
      </p>
    </div>
  </div>

  <form method="post" class="account-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-sage">Uložit nové heslo</button>
  </form>
</div>
{% endblock %}
