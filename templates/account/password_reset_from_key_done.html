{% extends "base.html" %}
{% load static %}

{% block title %}Heslo změněno | CalmDog{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
{% endblock %}

{% block content %}
<section class="py-6">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="auth-card text-center">
          <div class="auth-eyebrow">Hotovo</div>
          <h1 class="auth-title">Heslo bylo změněno</h1>
          <p class="auth-lead">Nyní se můžete přihlásit svým novým heslem.</p>
          <a href="{% url 'account_login' %}" class="auth-btn">Přihlásit se →</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
