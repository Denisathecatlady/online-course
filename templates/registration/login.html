{% extends "base.html" %}

{% block title %}Přihlášení{% endblock %}

{% block content %}
<section class="py-6">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">

        <div class="card card-soft">
          <div class="card-body p-4 p-md-5">

            <h1 class="section-title-sm mb-4 text-center">
              Přihlášení
            </h1>

            <form method="post">
              {% csrf_token %}

              {% if form.non_field_errors %}
                <div class="alert alert-danger">
                  {{ form.non_field_errors }}
                </div>
              {% endif %}

              <div class="mb-3">
                <label class="form-label">E-mail</label>
                {{ form.username }}
              </div>

              <div class="mb-4">
                <label class="form-label">Heslo</label>
                {{ form.password }}
              </div>

              <button type="submit" class="btn btn-sage w-100">
                Přihlásit se →
              </button>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
