<h1>{{ product.name }}</h1>
<p>{{ product.description }}</p>

<hr>

<h3>Varianty</h3>

<div class="row">
{% for plan in plans %}
  <div class="col-md-4 mb-4">
    <div class="card p-4">

      <h4>{{ plan.name }}</h4>
      <p>{{ plan.price_czk }} Kč</p>

      <a href="{% url 'payments:add_course_to_cart' product.slug plan.code %}"
         class="btn btn-sage w-100">
         Přidat do košíku
      </a>

    </div>
  </div>
{% endfor %}
</div>
